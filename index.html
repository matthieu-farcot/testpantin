<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pantin Grand Écart – clic</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body>
<a-scene background="color:#ECECEC">

  <!-- SOL -->
  <a-plane rotation="-90 0 0" width="10" height="10" color="#bbb"></a-plane>

  <!-- CAISSES -->
  <a-entity id="boxL" position="-0.8 0.25 0">
    <a-box width="0.6" height="0.5" depth="0.6" color="#7a4a1f"></a-box>
    <a-box id="footL" position="0 0.3 0"
           width="0.3" height="0.1" depth="0.4" color="#111"></a-box>
  </a-entity>

  <a-entity id="boxR" position="0.8 0.25 0">
    <a-box width="0.6" height="0.5" depth="0.6" color="#7a4a1f"></a-box>
    <a-box id="footR" position="0 0.3 0"
           width="0.3" height="0.1" depth="0.4" color="#111"></a-box>
  </a-entity>

  <!-- PANTIN -->
  <a-entity id="pantin" pantin>

    <!-- Bassin -->
    <a-sphere id="pelvis" radius="0.15" color="#333"></a-sphere>

    <!-- Jambes (cylindres connecteurs) -->
    <a-cylinder id="legL" radius="0.1" color="#3b82f6"></a-cylinder>
    <a-cylinder id="legR" radius="0.1" color="#3b82f6"></a-cylinder>

    <!-- Tronc -->
    <a-box id="torso" width="0.45" height="0.8" depth="0.25"
           color="#ef4444"></a-box>

    <!-- Bras -->
    <a-box width="0.15" height="0.6" depth="0.15"
           position="-0.4 0.2 0" color="#f59e0b"></a-box>
    <a-box width="0.15" height="0.6" depth="0.15"
           position="0.4 0.2 0" color="#f59e0b"></a-box>

    <!-- Tête -->
    <a-sphere radius="0.25" position="0 0.7 0" color="#fcd5b5"></a-sphere>

  </a-entity>

  <!-- CAMÉRA -->
  <a-entity position="0 2.5 4">
    <a-camera></a-camera>
  </a-entity>

</a-scene>

<script>
let expanding = false;
let spread = 1.6;

window.addEventListener("mousedown", () => expanding = true);
window.addEventListener("mouseup", () => expanding = false);

/* -------- ANIMATION DES CAISSES -------- */
AFRAME.registerComponent("box-spread", {
  tick() {
    const speed = 0.02;
    spread += expanding ? speed : -speed;
    spread = Math.min(Math.max(spread, 0.6), 2.2);

    document.querySelector("#boxL").object3D.position.x = -spread / 2;
    document.querySelector("#boxR").object3D.position.x =  spread / 2;
  }
});
document.querySelector("a-scene").setAttribute("box-spread", "");

/* -------- PANTIN -------- */
AFRAME.registerComponent("pantin", {
  tick() {
    const footL = document.querySelector("#footL")
      .object3D.getWorldPosition(new THREE.Vector3());
    const footR = document.querySelector("#footR")
      .object3D.getWorldPosition(new THREE.Vector3());

    const legLength = 1.2;
    const d = footL.distanceTo(footR);
    const half = d / 2;

    // hauteur du bassin (grand écart)
    const pelvisY = footL.y +
      Math.sqrt(Math.max(legLength * legLength - half * half, 0.1));
    const pelvisX = (footL.x + footR.x) / 2;

    const pelvis = document.querySelector("#pelvis").object3D;
    pelvis.position.set(pelvisX, pelvisY, 0);

    // jambes connectées
    connectLeg("#legL", footL, pelvis.position);
    connectLeg("#legR", footR, pelvis.position);

    // tronc
    const torso = document.querySelector("#torso").object3D;
    torso.position.set(pelvisX, pelvisY + 0.5, 0);
  }
});

function connectLeg(id, foot, pelvis) {
  const leg = document.querySelector(id).object3D;

  const mid = foot.clone().add(pelvis).multiplyScalar(0.5);
  const length = foot.distanceTo(pelvis);

  leg.position.copy(mid);
  leg.scale.set(1, length / 1, 1); // cylindre unité = 1
  leg.lookAt(pelvis);
  leg.rotateX(Math.PI / 2); // alignement cylindre
}
</script>

</body>
</html>
