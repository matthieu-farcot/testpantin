<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Patin – Grand écart</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene background="color: #ECECEC">

      <!-- Sol -->
      <a-plane rotation="-90 0 0" width="10" height="10" color="#aaa"></a-plane>

      <!-- Caisse gauche -->
      <a-entity id="boxLeft" position="-1 0.25 0">
        <a-box width="0.6" height="0.5" depth="0.6" color="#8B4513"></a-box>

        <!-- Pied gauche (collé à la caisse) -->
        <a-box
          id="footLeft"
          position="0 0.3 0"
          width="0.2"
          height="0.1"
          depth="0.4"
          color="#222">
        </a-box>
      </a-entity>

      <!-- Caisse droite (déplaçable) -->
      <a-entity id="boxRight" position="1 0.25 0" move-box>
        <a-box width="0.6" height="0.5" depth="0.6" color="#8B4513"></a-box>

        <!-- Pied droit -->
        <a-box
          id="footRight"
          position="0 0.3 0"
          width="0.2"
          height="0.1"
          depth="0.4"
          color="#222">
        </a-box>
      </a-entity>

      <!-- Corps du patin -->
      <a-box
        id="body"
        position="0 1 0"
        width="0.3"
        height="1"
        depth="0.3"
        color="#0077ff">
      </a-box>

      <!-- Caméra -->
      <a-entity position="0 2 4">
        <a-camera></a-camera>
      </a-entity>

    </a-scene>

    <script>
      // Déplacement de la caisse droite avec les flèches
      AFRAME.registerComponent("move-box", {
        tick: function () {
          const pos = this.el.object3D.position;
          const speed = 0.02;

          if (keys["ArrowLeft"]) pos.x -= speed;
          if (keys["ArrowRight"]) pos.x += speed;
        }
      });

      const keys = {};
      window.addEventListener("keydown", e => keys[e.key] = true);
      window.addEventListener("keyup", e => keys[e.key] = false);

      // Mise à jour du corps du patin (grand écart)
      AFRAME.registerComponent("patin-body", {
        tick: function () {
          const footL = document.querySelector("#footLeft").object3D.getWorldPosition(new THREE.Vector3());
          const footR = document.querySelector("#footRight").object3D.getWorldPosition(new THREE.Vector3());

          // Centre entre les deux pieds
          const center = footL.clone().add(footR).multiplyScalar(0.5);
          this.el.object3D.position.copy(center);
          this.el.object3D.position.y += 0.6;

          // Distance entre les pieds
          const distance = footL.distanceTo(footR);

          // Étirement du corps
          this.el.object3D.scale.y = distance * 0.8;
        }
      });

      document.querySelector("#body").setAttribute("patin-body", "");
    </script>
  </body>
</html>
