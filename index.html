<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pantin – Grand écart 180°</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body>
<a-scene background="color:#ECECEC">

  <!-- SOL -->
  <a-plane rotation="-90 0 0" width="10" height="10" color="#bbb"></a-plane>

  <!-- CAISSES -->
  <a-entity id="boxL">
    <a-box position="0 0.25 0" width="0.6" height="0.5" depth="0.6" color="#7a4a1f"></a-box>
    <a-box id="footL" position="0 0.55 0" width="0.3" height="0.1" depth="0.4" color="#111"></a-box>
  </a-entity>

  <a-entity id="boxR">
    <a-box position="0 0.25 0" width="0.6" height="0.5" depth="0.6" color="#7a4a1f"></a-box>
    <a-box id="footR" position="0 0.55 0" width="0.3" height="0.1" depth="0.4" color="#111"></a-box>
  </a-entity>

  <!-- PANTIN (ÉPURÉ) -->
  <a-entity id="pantin" pantin>
    <!-- pelvis LOGIQUE (pas de mesh) -->
    <a-entity id="pelvis"></a-entity>

    <!-- jambes -->
    <a-cylinder id="legL" radius="0.08" color="#2563eb"></a-cylinder>
    <a-cylinder id="legR" radius="0.08" color="#2563eb"></a-cylinder>
  </a-entity>

  <!-- CAMÉRA -->
  <a-entity position="0 2.5 4">
    <a-camera></a-camera>
  </a-entity>

</a-scene>

<script>
/* -------- ANIMATION DES CAISSES -------- */
let spreading = false;
let spread = 1.2;

const boxWidth = 0.6;
const legLength = 1.2;
const minSpread = boxWidth;
const maxSpread = 2 * legLength;

window.addEventListener("mousedown", () => spreading = true);
window.addEventListener("mouseup", () => spreading = false);

AFRAME.registerComponent("box-spread", {
  tick() {
    const speed = 0.02;
    spread += spreading ? speed : -speed;

    // contrainte physique : pas d'interpénétration
    spread = Math.min(Math.max(spread, minSpread), maxSpread);

    document.querySelector("#boxL").object3D.position.x = -spread / 2;
    document.querySelector("#boxR").object3D.position.x =  spread / 2;
  }
});

/* -------- PANTIN GÉOMÉTRIQUE -------- */
AFRAME.registerComponent("pantin", {
  tick() {
    const footL = document.querySelector("#footL").object3D.getWorldPosition(new THREE.Vector3());
    const footR = document.querySelector("#footR").object3D.getWorldPosition(new THREE.Vector3());

    const L = 1.2; // longueur jambe
    const d = footL.distanceTo(footR);
    const half = d / 2;

    let pelvisY;
    if (d >= 2 * L) {
      // grand écart facial complet (180°)
      pelvisY = footL.y;
    } else {
      pelvisY = footL.y + Math.sqrt(L * L - half * half);
    }

    const pelvisX = (footL.x + footR.x) / 2;
    const pelvis = document.querySelector("#pelvis").object3D;
    pelvis.position.set(pelvisX, pelvisY, 0);

    connectLeg("#legL", footL, pelvis.position);
    connectLeg("#legR", footR, pelvis.position);
  }
});

function connectLeg(id, foot, pelvis) {
  const leg = document.querySelector(id).object3D;

  const mid = foot.clone().add(pelvis).multiplyScalar(0.5);
  const length = foot.distanceTo(pelvis);

  leg.position.copy(mid);
  leg.scale.set(1, length, 1);
  leg.lookAt(pelvis);
  leg.rotateX(Math.PI / 2);
}
</script>

</body>
</html>
